name: SonarScanner end
description: >-
  Ends the analysis sonar-begin began, with the same token. On a pull_request
  event it never fails the job, since sonar-pr-compare.yml is the pull
  request's gate; otherwise it fails as the scanner does.

inputs:
  token:
    description: SonarQube token that can analyse the main project.
    default: ""
  pr-token:
    description: SonarQube token that can create and analyse pull request projects.
    default: ""

runs:
  using: composite
  steps:
    - name: SonarScanner end
      shell: bash
      env:
        SONAR_TOKEN: ${{ inputs.token }}
        SONAR_PR_TOKEN: ${{ inputs.pr-token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: >-
        python3 "$GITHUB_ACTION_PATH/../sonar-scanner/sonar_scanner.py" end
        --scanner "$RUNNER_TEMP/dotnet-sonarscanner/dotnet-sonarscanner"
