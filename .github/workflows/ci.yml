name: CI

# Every gate runs at PR time (ADR-0003 decision 4). A nuget.org version number is spent the moment
# it is pushed, so a gate that first fires at tag time has already cost one. release.yml re-runs
# this set and is meant to discover nothing new; the only checks it adds are the two that cannot
# exist before a tag — AnalyzerReleases.Unshipped.md holding no rule rows (decision 8), and the
# CHANGELOG section its release body is cut from (decision 9).
on:
  pull_request:
  push:
    branches: [main]

# This workflow never holds `id-token: write` (ADR-0003 decision 3). That permission belongs to
# exactly one file — release.yml, the only thing in the repository that can mint a nuget.org key
# and push something unrevocable. Declaring the whole permission set explicitly, rather than
# inheriting the repository default, is what makes that absence a property of this file that a
# reviewer can see, instead of a property of a settings page they cannot.
permissions:
  contents: read

# A superseded pull request run proves nothing about the commit that replaced it, so pull requests
# share a group per ref and the older run is cancelled.
#
# Pushes to main each take a group of their own — github.run_id is unique per run — rather than
# sharing one with cancellation switched off. Sharing would not have been enough: a concurrency
# group holds at most one running and one pending run, and a third arrival cancels the *pending*
# one, so two quick merges could leave the commit between them with no verdict at all. Every commit
# on main is one a release could be cut from, and none may inherit silence from being overtaken.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-{1}', github.workflow, github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

  # ContinuousIntegrationBuild=true in CI regardless (ADR-0003 decision 10): it normalises embedded
  # paths and costs nothing. It is set as an environment variable rather than a `-p:` flag on each
  # step so that the build and the pack that produce the artifact whose paths are at stake cannot
  # disagree about it, nor a step added later forget it. MSBuild surfaces environment variables as
  # properties, and nothing in this repository assigns this one, so the value survives to every
  # project.
  ContinuousIntegrationBuild: true

jobs:
  verify:
    name: Build, test and verify the package
    # GitHub-hosted, per ADR-0003 decision 3: the homelab self-hosted runners are offline and
    # scoped to another repository, and the fleet's ruleset should not depend on the homelab being
    # up. Going public also removed the Actions allowance as a constraint.
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # A throwaway version for the package the smoke test gates, named once so the pack step and
    # the path handed to the script cannot disagree. Never pushed anywhere.
    env:
      SMOKE_VERSION: 0.0.1-smoke

    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          # Nothing in this workflow pushes, and the smoke test restores third-party packages from
          # nuget.org inside this job. Leaving the default would park a credential in .git/config
          # for that restore to run alongside, buying nothing.
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          # The SDK is load-bearing beyond compiling: it is the source of the CA analyzers, and
          # spec §2.3 froze the ruleset derivation against 10.0.110. This comment used to justify a
          # floating patch on the grounds that the shipped config enumerated no CA rules yet; #17
          # enumerated 29 of them, so that premise is gone and what replaces it is narrower.
          #
          # A floating patch is still the right trade, because nothing this workflow asserts is
          # patch-sensitive. The expected ruleset is compared with the shipped config file, not with
          # anything the SDK reports, so it cannot drift with the runner. The behavioural assertions
          # are that CA2200 and CA2252 fire and that CA2007 and CA1707 do not — properties of rules
          # that have been stable for releases, and a newer patch adding a default-on rule would
          # simply leave it off under the blanket, which is the seal working rather than failing.
          #
          # What would break is narrow and loud: a patch that retires an enumerated ID, or changes
          # one of those four rules' default severity or enabled state. The smoke test fails on the
          # spot if so — it does not degrade quietly — and the remedy is unchanged: a global.json,
          # which pins dev machines and CI to the same SDK, not a version typed into this file where
          # only CI would honour it.
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Aprbrown.Analyzers.slnx

      # This is the dogfooding gate (spec §7, ADR-0003 decision 6). The repository consumes the
      # same physical config file the packaging project packs, and the package props supply
      # TreatWarningsAsErrors=true, so a house-rule violation in this repository's own source is a
      # build error here rather than a warning scrolling past. Nothing extra is needed to enforce
      # that — which is the point — so there is no separate lint step to drift from it.
      - name: Build
        run: dotnet build Aprbrown.Analyzers.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Aprbrown.Analyzers.slnx -c Release --no-build

      # The smoke test never packs; its caller does (ADR-0003 amendment 3). release.yml packs the
      # tag version here instead, so this file holds the smoke version and nothing else does. Into
      # the runner's temp directory, not artifacts/, because nothing here is uploaded.
      - name: Pack a smoke version
        run: |
          dotnet pack src/Aprbrown.Analyzers.Package/Aprbrown.Analyzers.Package.csproj \
            -c Release --no-build -o "$RUNNER_TEMP/smoke" -p:Version="$SMOKE_VERSION"

      # Invoke the script, never reimplement its assertions in YAML (ADR-0003 decision 5). The
      # gate has to be runnable on a dev machine to be worth anything, and a YAML copy of it would
      # be a second set of assertions free to disagree with the first — with CI's copy the only
      # one anybody runs. A failing assertion inside the script exits non-zero and fails this step.
      - name: Pack-consume smoke test
        run: ./scripts/verify-package.sh "$RUNNER_TEMP/smoke/Aprbrown.Analyzers.$SMOKE_VERSION.nupkg"

      # The gate's refusals: handed a deliberately broken package, it must fail, and for the right
      # reason. Only possible since it stopped packing its own (amendment 3).
      - name: Smoke test refusal tests
        run: ./scripts/tests/verify-package-tests.sh

      # The comparison the smoke test makes against the expected ruleset (#51), over canned pairs:
      # that it passes the same ruleset however it is commented or spaced, and that it names every
      # line a different one adds, drops, re-levels or duplicates.
      - name: Expected ruleset comparison tests
        run: ./scripts/tests/ruleset-diff-tests.sh

      # The comparison the smoke test makes between a fixture build and the fixture's expectation
      # markers (#52), over canned logs: that it names every diagnostic a build raised and no marker
      # declares, every declared one it did not raise, and any severity in between — and refuses a
      # marker no build could ever satisfy.
      - name: Fixture diagnostic comparison tests
        run: ./scripts/tests/diagnostic-diff-tests.sh

      # The release-time gates are the one pair of checks that cannot run at PR time — neither has
      # anything to check until a version number exists — but the *scripts* implementing them can,
      # and by the same reasoning: a parser that first proves itself at release time has already
      # cost a version number if it was wrong. These tests run them over fixtures, so what fires at
      # tag time is a gate that has been demonstrated to fire.
      - name: Release gate tests
        run: ./scripts/tests/release-gate-tests.sh
